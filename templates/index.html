<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        /* Layout styling */
        .container {
            display: flex;
            gap: 40px;
            margin: 50px;
            font-family: sans-serif;
        }

        /* Custom dropdown menu styling */
        .dropdown {
            position: relative;
            display: inline-block;
            width: 200px;
        }

        .dropdown-label {
            background: #007bff;
            color: white;
            padding: 10px;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
        }

        .dropdown-options {
            display: none;
            position: absolute;
            background: #f9f9f9;
            width: 100%;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
            z-index: 1;
        }

        /* Show options when hovering over the main dropdown container */
        .dropdown:hover .dropdown-options {
            display: block;
        }

        .option-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #ddd;
        }

        .option-item:hover {
            background-color: #f1f1f1;
        }

        /* Map display area logic */
        .map-display {
            width: 500px;
            height: 400px;
            border: 2px solid #ccc;
            position: relative;
        }

        .map-image {
            width: 10%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            display: none; /* Hide all images by default */
        }

        /* Core CSS Trick: Target images based on which option is hovered */
        
        /* 1. Show the default map initially */
        #default-map {
            display: block;
        }

        /* 2. Hide default map when ANY option wrapper is hovered */
        .container:has(.option-item:hover) #default-map {
            display: none;
        }

        /* 3. Match specific option hovers to specific images using structural IDs */
        {% for opt in options %}
            .container:has(#{{ opt.id }}:hover) #img-{{ opt.id }} {
              display: block;
        }
        {% endfor %}

        .bg-image {
            width: 100%;
            height: 100%;
            display: block;
        }

        .overlay-image {
            position: absolute;
            top: 20px;      
            left: 20px;    
            z-index: 10;    
            width: 50px;  
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Dropdown Menu -->
        <div class="dropdown">
            <div class="dropdown-label">Select a Region ▾</div>
            <div class="dropdown-options">
                {% for opt in options %}
                    <div class="option-item" id="{{ opt.id }}">{{ opt.name }}</div>
                {% endfor %}
            </div>
        </div>

        <!-- Map Display Area -->
        <div class="map-display">
            <!-- Default Image -->
             
            <img id="default-map" class= "bg-image"  src="{{ url_for('static', filename=default_map) }}" alt="Base Map">
            
            <!-- Hover Dynamic Images -->
            {% for opt in options %}
                <img id="img-{{ opt.id }}" class="map-image" src="{{ url_for('static', filename=opt.img) }}" alt="{{ opt.name }}">
            {% endfor %}
        </div>
    </div>

</body>
</html>
