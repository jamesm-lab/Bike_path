<!DOCTYPE html>
<html lang="en">
<body>


    <form method="POST" action="/">
        <label for="lang-select">Choose an option:</label>
        
        <!-- The 'name' attribute is critical for Flask to identify the submitted data -->
        <select name="programming_language" id="lang-select">
            <option value="" disabled selected>-- Select Language --</option>
            {% for language in languages %}
                <option value="{{ language }}">{{ language }}</option>
            {% endfor %}
        </select>
        
        <button type="submit">Submit Choice</button>
    </form>


    <a href="{{ url_for('time') }}">
        <button type="button">Shortest time</button>
    </a>
    <a href="{{ url_for('distance') }}">
        <button type="button">Shortest distance</button>
    </a>
</body>
</html>
