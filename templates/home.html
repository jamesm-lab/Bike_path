<!DOCTYPE html>
<html lang="en">
    
<body>
    <h1>Welcome to my bikepath finder. It follows only seperated and shared paths to get you to your destination either in the shortast distance or time. Enjoy!</h1>

    <form method="get" action="{{ url_for('shortest') }}">
    <select name="start">
        <option value="" disabled selected>-- Select Start Location --</option>
        {% for language in languages %}
        <option value="{{ language }}">{{ language }}</option>
        {% endfor %}
    </select>

    <select name="end">
        <option value="" disabled selected>-- Select End Location --</option>
        {% for language in languages %}
        <option value="{{ language }}">{{ language }}</option>
        {% endfor %}
    </select>

    <br>
    <br>

    <button type="submit" name="mode" value="time">Shortest time</button>
    <button type="submit" name="mode" value="distance">Shortest distance</button>
    </form>

    <img src="{{ url_for('static', filename='Screenshot 2026-10-17 204303.png') }}" alt="Rough Map of Cycle Newtork", style="width:100%">


    
</body>
</html>
